<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lucky7AI · Stats Filter</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--gold2:#FFA500;--red2:#FF3333;--green:#00FF88;--dark:#05070D;--card:#0C1020;--border:#1A2035;--text:#E8E8E8;--muted:#8a93a8;
  --apex:#4CC9F0;--oracle:#A855F7;--zeus:#FFD700;--viper:#FF4444;--aria:#00FF88;--luna:#F472B6;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;
  background:radial-gradient(ellipse at 50% 0%,#1a1305 0%,var(--dark) 55%);}
.wrap{max-width:760px;margin:0 auto;padding:30px 16px 70px;}
.head{text-align:center;margin-bottom:20px;}
.brand{font-family:'Cinzel',serif;font-weight:900;font-size:24px;color:var(--gold);letter-spacing:.05em;}
.brand span{color:var(--red2);}
.tagline{color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:3px;}
.back{display:inline-block;margin-bottom:14px;color:var(--gold2);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;}

.controls{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
.ctrl-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-weight:700;margin:4px 0 8px;}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.pill{background:var(--dark);border:1px solid var(--border);border-radius:20px;padding:9px 16px;font-size:13px;
  font-weight:600;color:var(--text);cursor:pointer;font-family:'Rajdhani',sans-serif;transition:all .15s;
  -webkit-tap-highlight-color:transparent;}
.pill:hover{border-color:var(--gold2);}
.pill.active{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.08);}
.custom{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;}
.custom input{background:var(--dark);border:1px solid var(--border);border-radius:8px;color:#fff;
  font-family:'Rajdhani',sans-serif;font-size:14px;padding:8px 10px;}
.custom label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px;}
.scard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.scard .s-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.scard .s-val{font-family:'Cinzel',serif;font-size:18px;color:var(--gold);font-weight:700;}
.scard .s-val.red{color:var(--red2);} .scard .s-val.green{color:var(--green);}

.rows{display:flex;flex-direction:column;gap:8px;}
.row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.row .rank{font-family:'Cinzel',serif;font-size:18px;color:var(--muted);font-weight:900;text-align:center;}
.row .bot{font-family:'Cinzel',serif;font-size:17px;font-weight:700;}
.row .botmeta{font-size:12px;color:var(--muted);margin-top:2px;}
.row .net{font-family:'Cinzel',serif;font-size:17px;font-weight:700;text-align:right;}
.row .net.pos{color:var(--green);} .row .net.neg{color:var(--red2);}
.row.apex .bot{color:var(--apex);} .row.oracle .bot{color:var(--oracle);} .row.zeus .bot{color:var(--zeus);}
.row.viper .bot{color:var(--viper);} .row.aria .bot{color:var(--aria);} .row.luna .bot{color:var(--luna);}

.status{text-align:center;color:var(--muted);font-size:13px;padding:24px;}
.blurb{background:linear-gradient(135deg,#15110a,#0a0d16);border:1px solid var(--gold);border-radius:12px;padding:16px;margin-top:18px;}
.blurb h3{font-family:'Cinzel',serif;color:var(--gold);font-size:14px;margin-bottom:8px;letter-spacing:.05em;}
.blurb .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.blurb .ptab{background:var(--dark);border:1px solid var(--border);border-radius:16px;padding:7px 14px;font-size:12px;
  font-weight:700;color:var(--muted);cursor:pointer;font-family:'Rajdhani',sans-serif;letter-spacing:.05em;
  -webkit-tap-highlight-color:transparent;}
.blurb .ptab.active{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.08);}
.blurb .txt{font-size:14px;color:var(--text);line-height:1.6;white-space:pre-wrap;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:12px;}
.copybtn{margin-top:10px;background:transparent;border:1px solid var(--border);color:var(--gold);
  padding:8px 18px;border-radius:18px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}
.copybtn:hover{border-color:var(--gold);}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:99999;background:#05070D;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;">
  <div style="font-family:'Cinzel',serif;font-weight:900;font-size:26px;color:#FFD700;letter-spacing:.05em;margin-bottom:6px;">Lucky<span style="color:#FF3333;">7</span>AI</div>
  <div style="color:#8a93a8;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:24px;">Operator Tools</div>
  <input id="gatePass" type="password" inputmode="numeric" placeholder="Password"
    style="background:#0C1020;border:1px solid #1A2035;border-radius:10px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:18px;padding:13px 16px;width:200px;text-align:center;letter-spacing:.1em;">
  <button onclick="checkGate()"
    style="margin-top:14px;background:linear-gradient(135deg,#8B0000,#CC0000);color:#FFD700;border:1px solid #FFD700;border-radius:22px;font-family:'Cinzel',serif;font-weight:700;font-size:15px;padding:11px 30px;cursor:pointer;">Enter</button>
  <div id="gateErr" style="color:#FF4444;font-size:13px;margin-top:12px;height:16px;"></div>
  <div style="color:#FFA500;font-size:12px;margin-top:6px;letter-spacing:.04em;">💡 Hint: hotel room safe box</div>
  <div style="color:#5a6275;font-size:11px;margin-top:20px;max-width:240px;text-align:center;line-height:1.5;">Private tool. Shows public leaderboard data only.</div>
</div>

<div id="app" style="display:none;">
<div class="wrap">
  <a class="back" href="hub.html">&larr; Hub</a>
  <div class="head">
    <div class="brand">Lucky<span>7</span>AI</div>
    <div class="tagline">Stats Filter · Bot Arena</div>
  </div>

  <div class="controls">
    <div class="ctrl-label">📅 Date Range</div>
    <div class="btn-row" id="rangeBtns">
      <button class="pill" data-range="today">Today</button>
      <button class="pill active" data-range="week">Last 7 Days</button>
      <button class="pill" data-range="month">Last 30 Days</button>
      <button class="pill" data-range="all">All-Time</button>
      <button class="pill" data-range="custom">Custom</button>
    </div>
    <div class="custom" id="customRow" style="display:none;">
      <label>From <input type="date" id="fromDate"></label>
      <label>To <input type="date" id="toDate"></label>
      <button class="pill" onclick="loadCustom()">Go</button>
    </div>

    <div class="ctrl-label">↕️ Sort By</div>
    <div class="btn-row" id="sortBtns">
      <button class="pill active" data-sort="netProfit">Most Money Won</button>
      <button class="pill" data-sort="totalWins">Most Winning Lines</button>
      <button class="pill" data-sort="winRate">Best Win Rate</button>
      <button class="pill" data-sort="worstLoss">Biggest Loser</button>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="rows" id="rows"></div>
  <div class="status" id="status">Loading…</div>

  <div class="blurb" id="blurb" style="display:none;">
    <h3>📝 Ready-to-post — tap Copy</h3>
    <div class="tabs" id="postTabs">
      <button class="ptab active" data-post="fb-en">FB · EN</button>
      <button class="ptab" data-post="fb-es">FB · ES</button>
      <button class="ptab" data-post="x-en">X · EN</button>
      <button class="ptab" data-post="x-es">X · ES</button>
    </div>
    <div class="txt" id="blurbTxt"></div>
    <button class="copybtn" onclick="copyBlurb()">Copy this version</button>
  </div>
</div>

<script>
// IMPORTANT: this calls your live Vercel API. Deploy /api/stats.js for this to return real data.
var API = "https://www.lucky7ai.com/api/stats";
var state = { range:'week', sort:'netProfit', from:null, to:null };

function ymd(d){ return d.toISOString().slice(0,10); }
function rangeToDates(r){
  var to = new Date();
  var from = new Date();
  if(r==='today'){ /* from=to=today */ }
  else if(r==='week'){ from.setDate(to.getDate()-6); }
  else if(r==='month'){ from.setDate(to.getDate()-29); }
  else if(r==='all'){ return {from:null,to:null}; }
  return { from: ymd(from), to: ymd(to) };
}

function setActive(group, attr, val){
  document.querySelectorAll('#'+group+' .pill').forEach(function(p){
    p.classList.toggle('active', p.getAttribute(attr)===val);
  });
}

function money(n){ return (n<0?'-$':'$') + Math.abs(Math.round(n)).toLocaleString('en-US'); }

function load(){
  var status = document.getElementById('status');
  status.textContent = 'Loading…';
  document.getElementById('rows').innerHTML='';
  document.getElementById('summary').innerHTML='';
  document.getElementById('blurb').style.display='none';

  var qs = [];
  if(state.from) qs.push('from='+state.from);
  if(state.to) qs.push('to='+state.to);
  qs.push('sort='+state.sort);
  var url = API + '?' + qs.join('&');

  fetch(url).then(function(r){ return r.json(); }).then(function(data){
    if(data.error || !data.bots){ status.textContent = 'No data ('+(data.error||'empty')+'). Is /api/stats deployed?'; return; }
    render(data);
    status.textContent = data.filesUsed + ' day(s) in range · ' + (data.range.from||'start') + ' → ' + (data.range.to||'latest');
  }).catch(function(e){
    status.textContent = 'Could not reach /api/stats — deploy stats.js first. ('+e.message+')';
  });
}

function render(data){
  // summary cards
  var s = data.summary;
  var combined = s.combinedProfit || 0;
  document.getElementById('summary').innerHTML =
    card('Leader', s.leader||'—') +
    card('Most Wins', s.mostWins||'—') +
    card('Combined Net', money(combined), combined<0?'red':'green') +
    card('Total Wins', (s.totalWins||0).toLocaleString());

  // rows
  var html='';
  data.bots.forEach(function(b,i){
    var cls = b.name.toLowerCase();
    var netCls = b.netProfit>=0?'pos':'neg';
    html += '<div class="row '+cls+'">'+
      '<div class="rank">'+(i+1)+'</div>'+
      '<div><div class="bot">'+b.name+'</div>'+
      '<div class="botmeta">'+b.totalWins+' wins · '+b.winRate+'% · '+b.daysCounted+' days</div></div>'+
      '<div class="net '+netCls+'">'+money(b.netProfit)+'</div>'+
    '</div>';
  });
  document.getElementById('rows').innerHTML = html;

  buildBlurb(data);
}

function card(lbl,val,cls){
  return '<div class="scard"><div class="s-lbl">'+lbl+'</div><div class="s-val '+(cls||'')+'">'+val+'</div></div>';
}

// Build all 4 post variants (FB/X × EN/ES) from the current filtered view
var POSTS = {};
var currentPost = 'fb-en';

function buildBlurb(data){
  if(!data.bots.length) return;
  var top = data.bots[0];
  var mostWins = data.bots.slice().sort(function(a,b){return b.totalWins-a.totalWins;})[0];
  var loser = data.bots.slice().sort(function(a,b){return a.netProfit-b.netProfit;})[0];
  var combined = money(data.summary.combinedProfit);

  var labelEN = ({today:'today',week:'this week',month:'this month',all:'all-time',custom:'this period'})[state.range] || 'this period';
  var labelES = ({today:'hoy',week:'esta semana',month:'este mes',all:'histórico',custom:'este período'})[state.range] || 'este período';

  var tagsEN = '#Lottery #AIpredictions #Lucky7AI #PowerballNumbers';
  var tagsES = '#Loteria #PrediccionesIA #Lucky7AI #NumerosDeLaSuerte';
  var link = 'lucky7ai.com/leaderboard.html';

  POSTS['fb-en'] =
    '🤖 BOT ARENA — '+labelEN.toUpperCase()+'\n\n'+
    'Our 6 AI lottery bots, scored honestly against real drawings:\n\n'+
    '🏆 Leader: '+top.name+' ('+money(top.netProfit)+' net)\n'+
    '🎯 Most winning lines: '+mostWins.name+' ('+mostWins.totalWins+')\n'+
    '📉 Toughest run: '+loser.name+' ('+money(loser.netProfit)+')\n'+
    '📊 Combined: '+combined+' across all 6\n\n'+
    'No fake wins. No hype. Just the honest math of beating the odds. 👇\n'+
    '🔗 Full board → '+link+'\n\n18+. Entertainment only. Play responsibly.\n\n'+tagsEN;

  POSTS['fb-es'] =
    '🤖 BOT ARENA — '+labelES.toUpperCase()+'\n\n'+
    'Nuestros 6 bots de lotería con IA, evaluados honestamente contra sorteos reales:\n\n'+
    '🏆 Líder: '+top.name+' ('+money(top.netProfit)+' neto)\n'+
    '🎯 Más líneas ganadoras: '+mostWins.name+' ('+mostWins.totalWins+')\n'+
    '📉 Racha más dura: '+loser.name+' ('+money(loser.netProfit)+')\n'+
    '📊 Combinado: '+combined+' entre los 6\n\n'+
    'Sin victorias falsas. Sin exageraciones. Solo la matemática honesta. 👇\n'+
    '🔗 Tabla completa → '+link+'\n\nMayores de 18. Solo entretenimiento. Juega responsablemente.\n\n'+tagsES;

  POSTS['x-en'] =
    '🤖 Bot Arena — '+labelEN+'\n\n'+
    '🏆 '+top.name+' leads ('+money(top.netProfit)+')\n'+
    '🎯 Most wins: '+mostWins.name+' ('+mostWins.totalWins+')\n'+
    '📊 Combined: '+combined+'\n\n'+
    'Honest AI lottery picks, scored vs real draws. 👇\n'+link+'\n\n18+. Entertainment only.\n#Lottery #AIpredictions #Lucky7AI';

  POSTS['x-es'] =
    '🤖 Bot Arena — '+labelES+'\n\n'+
    '🏆 '+top.name+' lidera ('+money(top.netProfit)+')\n'+
    '🎯 Más aciertos: '+mostWins.name+' ('+mostWins.totalWins+')\n'+
    '📊 Combinado: '+combined+'\n\n'+
    'Predicciones de lotería con IA, evaluadas vs sorteos reales. 👇\n'+link+'\n\n+18. Solo entretenimiento.\n#Loteria #PrediccionesIA #Lucky7AI';

  showPost(currentPost);
  document.getElementById('blurb').style.display = 'block';
}

function showPost(key){
  currentPost = key;
  document.getElementById('blurbTxt').textContent = POSTS[key] || '';
  document.querySelectorAll('#postTabs .ptab').forEach(function(p){
    p.classList.toggle('active', p.getAttribute('data-post')===key);
  });
}

function copyBlurb(){
  navigator.clipboard.writeText(POSTS[currentPost]||'')
    .then(function(){ var b=event.target; b.textContent='Copied ✓'; setTimeout(function(){b.textContent='Copy this version';},1500); });
}

// wire up buttons
document.querySelectorAll('#rangeBtns .pill').forEach(function(p){
  p.addEventListener('click', function(){
    var r = p.getAttribute('data-range');
    setActive('rangeBtns','data-range',r);
    state.range = r;
    document.getElementById('customRow').style.display = (r==='custom')?'flex':'none';
    if(r!=='custom'){ var d=rangeToDates(r); state.from=d.from; state.to=d.to; load(); }
  });
});
document.querySelectorAll('#sortBtns .pill').forEach(function(p){
  p.addEventListener('click', function(){
    var srt = p.getAttribute('data-sort');
    setActive('sortBtns','data-sort',srt);
    state.sort = srt; load();
  });
});
function loadCustom(){
  state.from = document.getElementById('fromDate').value || null;
  state.to   = document.getElementById('toDate').value || null;
  load();
}

document.querySelectorAll('#postTabs .ptab').forEach(function(p){
  p.addEventListener('click', function(){ showPost(p.getAttribute('data-post')); });
});

// initial load (last 7 days)
var d = rangeToDates('week'); state.from=d.from; state.to=d.to;
load();
</script>
</div>

<script>
function checkGate(){
  var v = document.getElementById('gatePass').value;
  if(v === '2024'){
    try{ sessionStorage.setItem('l7gate','1'); }catch(e){}
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    document.getElementById('gateErr').textContent = 'Wrong password';
    document.getElementById('gatePass').value='';
  }
}
document.getElementById('gatePass').addEventListener('keydown',function(e){ if(e.key==='Enter') checkGate(); });
try{ if(sessionStorage.getItem('l7gate')==='1'){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; } }catch(e){}
</script>
</body>
</html>
